<style>

 #review{margin:12px 0;padding:10px 14px;border-left:3px solid #bc9a67;background:#203336}#counts{color:#f1dfbe;font-variant-numeric:tabular-nums}#tip{display:block;margin-top:4px}#tempoBox{margin:12px 0;padding-block:8px;border-block:1px solid #405354}#tempoBox select{font:inherit;padding:4px 8px}#timings{display:block;margin-top:5px;white-space:pre-line}#coreMeter{display:block;margin-top:4px}.exposure-track{display:block;position:relative;background:#d9ac66;height:7px;overflow:hidden;border-radius:3px}

 </style><main><header><b>✧　회청탑 마법학교</b><small>전투마법과 · 2서클 실습</small></header><h1>골렘의 어깨를 봐</h1><div class="layout"><aside class="book"><h2>마법책</h2><article><small>수호 주문</small><h3>빛방패</h3><b>③ → ④</b><p>빛의 방패로 주먹을 흘려 골렘의 핵을 드러낸다.</p></article><article><small>공격 주문</small><h3>돌창</h3><b>① → ④ → ②</b><p>뾰족한 돌창을 쏘아 열린 핵을 맞히거나 금 간 기둥을 무너뜨린다.</p></article></aside><section class="scene"><div class="line hud"><b id="stage"></b><small id="stats"></small></div><div class="arena"><canvas id="art" width="700" height="404" aria-label="실습장과 골렘의 현재 동작"></canvas><button type="button" id="enemyCue" class="enemy-cue" hidden disabled><strong id="enemyText"></strong><span class="cue-track"><i id="bar"></i></span><span id="coreMeter" hidden><span class="exposure-track"><i id="elapsed"></i></span><small id="exposureLabel"></small></span></button><button id="pillarSpot" hidden aria-label="금이 간 기둥 조준" aria-pressed="false"></button><div id="prepared" class="prepared" hidden></div></div><div class="story"><h2 id="signal"></h2><p id="message"></p><p id="augment" hidden><strong>증강 · 핵 간섭</strong>　다음 핵 노출 시간이 50% 늘어납니다.</p><div id="review" hidden><strong>이번 결투 기록</strong> <small id="playedTempo"></small><div id="counts"></div><small id="tip"></small></div><div id="tempoBox" hidden><label for="tempo">다음 결투 속도</label> <select id="tempo"><option value="1">기본</option><option value="2">느린 연습</option></select><small id="timings"></small></div><div class="actions"><button id="rematch" hidden>골렘과 재대결</button><button class="action" id="action" hidden></button><button id="target" hidden></button></div></div></section><section class="panel"><div class="line"><h2>마법 입력판</h2><small id="size">2 × 2</small></div><p class="keys">숫자 키 1–4 또는 칸 클릭</p><div class="board" id="board"></div><div class="line"><small>입력 경로</small><b id="path">—</b></div><div id="feedback" role="status"></div></section></div><footer><details><summary>입력판 크기 비교</summary><button id="preview">9×9 크기 비교</button></details></footer></main>
<script>
const $=id=>document.getElementById(id), shield='34', crack='142';
const lessons=[shield,crack,shield,crack];
let mode='lesson',step=0,pose='wind',seq='',hp=3,hits=0,end=0,span=0,pillar=false,aim=false,preview=false,hiddenAt=0;
const copy={
lesson:['턴제 수업','어깨와 핵을 관찰하세요.'],ready:['수업 완료','실전에서는 시간이 흐릅니다. 어깨가 들리면 빛방패, 핵이 열리면 돌창을 쓰세요.'],
fight:['실시간 결투',''],lost:['재도전','골렘이 물러섰습니다. 종을 울려 결투부터 다시 시작하세요.'],
done:['첫 실습 완료','돌창으로 핵을 두 번 맞혔습니다.']};
const combatCues={
 wind:['어깨가 올라간다','③을 미리 입력하고 주먹을 보세요.'],
 strike:['주먹이 내려온다','③을 준비했다면 전투장의 ④를 클릭하거나 4를 누르세요.'],
 charge:['핵 덮개가 열린다','① → ④를 준비하고 핵의 빛을 기다리세요.'],
 core:['핵이 빛난다','① → ④를 준비했다면 전투장의 ②를 클릭하거나 2를 누르세요.'],
 reset:['골렘이 자세를 고친다','다음 방어의 첫 번호 ③을 준비할 수 있습니다.']
};
let firstBlockLearned=false;
let fractureAt=null,collapseAt=null;
const coreLight='#ffac74';
function pillarChoice(){return mode==='fight'&&pose==='wind'&&fractureAt!==null&&!pillar}

function showBlockGuide(){
 return mode==='fight'&&!firstBlockLearned&&seq==='3'&&(pose==='wind'||pose==='strike');
}
function arenaCues(){
 const fighting=mode==='fight';
 $('coreMeter').hidden=!(fighting&&pose==='core');
 $('coreMeter').classList.toggle('boosted',extendedCore());
 const canShield=seq==='3',canLance=seq==='14';
 const cues={
  wind:showBlockGuide()?'잠시 후 여기에 뜨는 ④를 클릭':'내려찍기 준비',strike:canShield?'④ 지금 방어':'내려찍기!',
  charge:'핵이 열리는 중',core:canLance?'② 지금 발사':'핵 노출',reset:''
 };
 const active=pose==='strike'||pose==='core';
 const earlyPillar=aim&&pose==='wind'&&canLance;
 const preparedText=canShield?'빛방패 준비 · ③':canLance?'돌창 준비 · ①④':seq==='1'?'돌창 준비 중 · ①':'';
 $('prepared').hidden=!fighting||!preparedText;
 $('prepared').textContent=preparedText;
 const finish=canShield&&pose==='strike'?'4':canLance&&(pose==='core'||earlyPillar)?'2':'';
 const cue=$('enemyCue');
 cue.classList.toggle('first-block-guide',showBlockGuide());
 cue.disabled=!fighting||!finish;
 cue.dataset.finish=finish;
 $('enemyCue').hidden=!fighting||!cues[pose];
 $('enemyCue').classList.toggle('active',active||earlyPillar);
 $('enemyText').textContent=earlyPillar?'② 기둥에 발사':cues[pose];
 $('bar').parentElement.hidden=pose!=='wind'||earlyPillar;
}let blocks=0,missedCores=0,lastMiss='';
const timing={firstWind:3000,wind:2200,strike:1100,charge:1500,core:1800};
let duelScale=1;
function tempoSummary(){
 const scale=Number($('tempo').value);
 const sec=ms=>(ms*scale/1000).toLocaleString('ko-KR')+'초';
 $('timings').textContent='빛방패 준비 '+sec(timing.firstWind)+' (다음부터 '+sec(timing.wind)+') · ④ 방어 '+sec(timing.strike)+'\n돌창 준비 '+sec(timing.charge)+' · ② 발사 '+sec(timing.core);
}
$('tempo').onchange=tempoSummary;
tempoSummary();
function showReview(){
 $('tempoBox').hidden=!['ready','lost','done'].includes(mode);
 $('playedTempo').textContent=duelScale===2?'느린 연습':'기본';
 const visible=['lost','done'].includes(mode);
 $('review').hidden=!visible;
 $('rematch').hidden=mode!=='done';
 if(!visible)return;
 const parts=['방어 '+blocks+'회','피격 '+(3-hp)+'회','핵 명중 '+hits+'회','핵 기회 놓침 '+missedCores+'회'];
 if(bonusHit)parts.push('핵 간섭 연장 중 명중');
 if(pillar)parts.push('기둥 차단 1회');
 $('counts').textContent=parts.join(' · ');
 $('tip').textContent=lastMiss;
}
let coreBoost=false,bonusHit=false;
function extendedCore(){return pose==='core' && span>timing.core*duelScale}
function inBonusWindow(now){return extendedCore() && now>=end-span+timing.core*duelScale && now<end}
function panel(){ arenaCues();showReview();
 $('augment').hidden=mode!=='fight'||!coreBoost;
 const fight=mode==='fight',lesson=mode==='lesson';
 $('stage').textContent=copy[mode][0];$('stats').textContent=fight?'체력 '+hp+'/3　핵 명중 '+hits+'/2':'';
 $('signal').textContent=fight?combatCues[pose][0]:lesson?(pose==='wind'?'오른쪽 어깨가 올라간다':pose==='core'?'어깨 덮개가 열렸다':'골렘이 자세를 고친다') : ({ready:'결투장의 종',lost:'결계가 공격을 막아냈다',done:'골렘 제압'})[mode];
 $('message').textContent=lesson?(step<2?(step===0?'빛나는 두 칸을 이어 빛방패를 펼치세요. 마지막 칸까지 골렘은 기다립니다.':'열린 핵에 돌창을 쏘세요. 대각선 아래로 긋고 오른쪽 위로 올리세요.'):'이번엔 안내 없이 같은 동작에 대응하세요.') :fight?combatCues[pose][1]+(pillarChoice()?' 빛나는 기둥을 눌러 돌창을 겨냥할 수도 있어요.':''):copy[mode][1];
 if(showBlockGuide()&&pose==='wind')$('message').textContent='빛방패가 준비됐어요. 골렘 위 안내에 커서를 두고 금색으로 바뀌면 클릭하세요.';
 $('action').hidden=!['ready','lost','done'].includes(mode);$('action').textContent=mode==='done'?'수업부터 다시':'종 울리기 · 결투 시작';
 $('target').hidden=!pillarChoice();$('pillarSpot').hidden=!pillarChoice();$('pillarSpot').setAttribute('aria-pressed',String(aim));$('target').textContent=aim?'기둥 조준 해제':'금 간 기둥 조준';
 $('preview').disabled=fight;$('size').textContent=preview?'9 × 9 미리보기':'2 × 2';$('path').textContent=seq.split('').join(' → ')||'—';
 $('preview').textContent=preview?'2×2 복귀':'9×9 크기 비교';grid();
}
function grid(){
 const board=$('board'),n=preview?9:2;
 if(board.dataset.n!=n){board.replaceChildren();board.dataset.n=n;board.style.gridTemplateColumns='repeat('+n+',1fr)';for(let i=1;i<=n*n;i++){let b=document.createElement('button');b.textContent=preview?'·':i;b.setAttribute('aria-label',i+'번 칸');b.onclick=()=>input(String(i));board.append(b)}
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 300 300');board.append(svg)}
 const buttons=[...board.querySelectorAll('button')];buttons.forEach((b,i)=>{b.disabled=preview||!['lesson','fight'].includes(mode);b.className=(seq.includes(String(i+1))?'used ':'')+(mode==='lesson'&&step<2&&lessons[step][seq.length]==i+1?'next':'')});
 const points=seq.split('').map(v=>{let b=buttons[Number(v)-1];return [(b.offsetLeft+b.offsetWidth/2)*300/board.clientWidth,(b.offsetTop+b.offsetHeight/2)*300/board.clientHeight].join(',')}).join(' ');
 board.lastChild.innerHTML='<polyline points="'+points+'" fill="none" stroke="#e4c68e" stroke-width="4" opacity=".6"/>';
}
function note(t){$('feedback').textContent=t}
let castQueue=[];
function flash(kind){
 const now=performance.now();
 castQueue=castQueue.filter(cast=>now<cast.start+cast.duration);
 // Keep contact readable even when the next order is entered immediately.
 const previous=castQueue.at(-1);
 const start=previous?Math.max(now,previous.start+690):now;
 castQueue.push({kind,start,descent:mode==='fight'&&pose==='strike'?progress(1-(end-now)/span):0,duration:kind==='shield'?1150:1450});
}
function progress(value){return Math.max(0,Math.min(1,value))}
function strokePath(points,color,width){
 c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));
 c.strokeStyle=color;c.lineWidth=width;c.stroke();
}
function ring(x,y,r,color){
 c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.strokeStyle=color;c.lineWidth=2;c.stroke();
}
function sparks(x,y,elapsed,color){
 const p=progress(elapsed/330);if(elapsed<0||p>=1)return;
 c.save();c.globalAlpha*=1-p;
 for(let i=0;i<10;i++){const a=i*Math.PI/5+.2,r=12+p*(i%2?32:49);
 strokePath([[x+Math.cos(a)*r*.55,y+Math.sin(a)*r*.55],[x+Math.cos(a)*r,y+Math.sin(a)*r]],color,3)}
 ring(x,y,8+30*p,color);c.restore()
}
function blockingShield(ms){
 c.save();c.globalAlpha=progress(ms/85)*progress((1150-ms)/370);
 const shape=[[198,188],[222,178],[235,195],[224,275],[198,302],[185,273]];
 c.shadowBlur=14;c.shadowColor='#7cfff2';poly(shape,'rgba(93,232,220,.48)');

 strokePath([[222,188],[214,230],[198,286]],'#e2ffef',3);
 sparks(229,230,ms-310,'#eaffda');c.restore()
}
function strikingArm(ms,raised,offset,descent=0){
 let x=raised?349:326,y=raised?125:258;
 if(ms!==null){
 const down=descent+(1-descent)*progress((ms-90)/220)**2,back=progress((ms-535)/420);
 x=349-91*down+69*back;y=125+105*down+46*back-offset;
 }
 if(ms===null&&pose==='strike'){x=349-91*descent;y=125+105*descent-offset}
 strokePath([[359,201],[x+25,(201+y)/2-12],[x,y]],'#314b4c',30);
 stone((359+x)/2,(195+y)/2,49,54,-.4);stone(x,y,70,71,-.26)
}
function stoneLance(ms,tx,ty){
 const flight=progress(ms/310),fade=progress((1450-ms)/340);
 const x=196+(tx-196)*flight,y=224+(ty-224)*flight;
 c.save();c.globalAlpha=fade;
 if(flight===1){ring(tx,ty,21,'#ffae73');sparks(tx,ty,ms-310,'#ffe4a2')}
 c.translate(x,y);c.rotate(Math.atan2(ty-224,tx-196));
 if(flight<1)poly([[-106,0],[-32,-5],[-10,0],[-32,5]],'#efce8c99');
 poly([[0,0],[-42,-10],[-71,-4],[-61,0],[-73,7],[-38,8]],'#9f8265');
 poly([[0,0],[-42,-10],[-69,-4],[-39,0]],'#fff0bc');
 strokePath([[-57,3],[-29,2],[-5,0]],'#6d5440',2);c.restore()
}
function phase(p,ms,keepInput=false){pose=p;span=ms*duelScale;end=performance.now()+span;aim=false;if(!keepInput)seq='';panel()}
let audio;function rumble(){if(!audio||audio.state!=='running')return;const o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime;o.type='triangle';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(53,t+.27);v.gain.setValueAtTime(.12,t);v.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(v);v.connect(audio.destination);o.start(t);o.stop(t+.31)}function battle(){try{audio??=new AudioContext();audio.resume().then(rumble).catch(()=>{})}catch{}duelScale=Number($('tempo').value);castQueue=[];mode='fight';hp=3;hits=0;coreBoost=false;bonusHit=false;blocks=0;missedCores=0;lastMiss='';pillar=false;fractureAt=null;collapseAt=null;preview=false;note('결투 시작');phase('wind',timing.firstWind)}
function deadline(){
 if(pose==='wind'){note('내려치기');phase('strike',timing.strike,true);return}
